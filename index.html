<!DOCTYPE html>
<html>
<head>
    <title>Titanic Survival Predictor</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:15px;
            width:400px;
            box-shadow:0px 5px 20px rgba(0,0,0,0.3);
        }

        h1{
            text-align:center;
            color:#2a5298;
        }

        label{
            font-weight:bold;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            background:#2a5298;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#1e3c72;
        }

        .result{
            margin-top:20px;
            text-align:center;
            font-size:20px;
            font-weight:bold;
            color:green;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>🚢 Titanic Predictor</h1>

    <form action="/predict_form" method="post">

        <label>Pclass</label>
        <input type="number" name="Pclass" required>

        <label>Sex (0 = Female, 1 = Male)</label>
        <input type="number" name="Sex" required>

        <label>Age</label>
        <input type="number" name="Age" required>

        <label>Fare</label>
        <input type="number" step="0.01" name="Fare" required>

        <button type="submit">Predict Survival</button>

    </form>

    {% if result %}
    <div class="result">
        Prediction: {{ result }}
    </div>
    {% endif %}

</div>

</body>
</html>
